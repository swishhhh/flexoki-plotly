name: Regenerate chart showcase

on:
  push:
    paths:
      - "flexoki_plotly.py"
      - "scripts/showcase.py"
      - ".github/workflows/showcase.yml"
  pull_request:
    paths:
      - "flexoki_plotly.py"
      - "scripts/showcase.py"
      - ".github/workflows/showcase.yml"

jobs:
  showcase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install .

      - name: Regenerate showcase
        run: python scripts/showcase.py --output docs/showcase

      - name: Commit generated HTML
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- docs/showcase; then
            echo "Showcase HTML is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/showcase
          git commit -m "Regenerate showcase HTML"
          git push