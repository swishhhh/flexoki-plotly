name: Regenerate chart showcase

on:
  push:
    paths:
      - "flexoki_plotly.py"
      - "scripts/showcase.py"
      - ".github/workflows/showcase.yml"
  pull_request:
    paths:
      - "flexoki_plotly.py"
      - "scripts/showcase.py"
      - ".github/workflows/showcase.yml"

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install .

      - name: Regenerate showcase
        run: python scripts/showcase.py --output docs/showcase

      - name: Check generated HTML is committed
        run: |
          if ! git diff --quiet -- docs/showcase; then
            echo "Generated showcase HTML is stale. Run the showcase script and commit the results."
            git diff --stat -- docs/showcase
            exit 1
          fi