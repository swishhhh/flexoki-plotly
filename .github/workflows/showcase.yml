name: Regenerate chart showcase

on:
  push:
    paths:
      - "flexoki_plotly.py"
      - "scripts/showcase.py"
      - ".github/workflows/showcase.yml"
  pull_request:
    paths:
      - "flexoki_plotly.py"
      - "scripts/showcase.py"
      - ".github/workflows/showcase.yml"

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install .

      - name: Regenerate light showcase
        run: python scripts/showcase.py --theme flexoki_light --output docs/showcase

      - name: Regenerate dark showcase
        run: python scripts/showcase.py --theme flexoki_dark --output docs/showcase

      - name: Check generated HTML is committed
        run: git diff --exit-code -- docs/showcase