<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flexoki Plotly - Interactive Demos</title>
    <link rel="stylesheet" href="{{ '/assets/css/flexoki.css' | relative_url }}">
</head>

<body data-theme="light">
    <main>
        <header class="page-header">
            <div>
                <h1>Flexoki Plotly</h1>
                <p>Interactive Plotly demos using the Flexoki light and dark themes.</p>
            </div>
            <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
                <span class="theme-toggle-icon" aria-hidden="true">◐</span>
                <span class="theme-toggle-label">Dark theme</span>
            </button>
        </header>

        <section class="showcase-grid">
            <h2>Chart showcase</h2>
            <iframe class="showcase" src="showcase/line.html" title="Flexoki line chart"></iframe>
            <iframe class="showcase" src="showcase/bar.html" title="Flexoki bar chart"></iframe>
            <iframe class="showcase" src="showcase/area.html" title="Flexoki area chart"></iframe>
            <iframe class="showcase" src="showcase/scatter.html" title="Flexoki scatter chart"></iframe>
            <iframe class="showcase" src="showcase/histogram.html" title="Flexoki histogram chart"></iframe>
            <iframe class="showcase" src="showcase/box.html" title="Flexoki box chart"></iframe>
            <iframe class="showcase" src="showcase/pie.html" title="Flexoki pie chart"></iframe>
            <iframe class="showcase" src="showcase/heatmap.html" title="Flexoki heatmap chart"></iframe>
        </section>
    </main>
    <script>
        const page = document.body;
        const toggle = document.querySelector(".theme-toggle");
        const frames = [...document.querySelectorAll("iframe.showcase")];
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
        let userSelected = false;

        function setTheme(theme) {
            const isDark = theme === "dark";
            page.dataset.theme = isDark ? "dark" : "light";
            toggle.setAttribute("aria-pressed", String(isDark));
            toggle.setAttribute("aria-label", `Switch to ${isDark ? "light" : "dark"} theme`);
            toggle.querySelector(".theme-toggle-label").textContent = `${isDark ? "Light" : "Dark"} theme`;
            frames.forEach((frame) => frame.contentWindow.postMessage({ type: "flexoki-theme", theme: page.dataset.theme }, window.location.origin));
        }

        toggle.addEventListener("click", () => {
            userSelected = true;
            setTheme(page.dataset.theme === "dark" ? "light" : "dark");
        });
        frames.forEach((frame) => frame.addEventListener("load", () => setTheme(page.dataset.theme)));
        systemTheme.addEventListener("change", (event) => {
            if (!userSelected) setTheme(event.matches ? "dark" : "light");
        });
        setTheme(systemTheme.matches ? "dark" : "light");
    </script>
</body>

</html>
