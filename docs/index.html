<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flexoki Plotly — Interactive Demos</title>
    <style>
        body {
            margin: 0;
            background: #fffcf0;
            color: #100f0f;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        p {
            color: #6f6e69;
        }

        section {
            margin-top: 3rem;
        }

        iframe {
            display: block;
            width: 100%;
            height: 650px;
            border: 1px solid #e6e4d9;
            border-radius: 8px;
            background: white;
        }

        iframe.showcase {
            height: 520px;
        }

        a {
            color: #205ea6;
        }
    </style>
</head>

<body>
    <main>
        <h1>Flexoki Plotly</h1>

        <p>
            Interactive Plotly demos using the Flexoki light and dark themes.
        </p>

        <section>
            <h2>Dark chart showcase</h2>
            <iframe class="showcase" src="showcase/flexoki_dark_line.html" title="Flexoki dark line chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_dark_bar.html" title="Flexoki dark bar chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_dark_area.html" title="Flexoki dark area chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_dark_scatter.html" title="Flexoki dark scatter chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_dark_histogram.html" title="Flexoki dark histogram chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_dark_box.html" title="Flexoki dark box chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_dark_pie.html" title="Flexoki dark pie chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_dark_heatmap.html" title="Flexoki dark heatmap chart">
            </iframe>
        </section>

        <section>
            <h2>Light chart showcase</h2>
            <iframe class="showcase" src="showcase/flexoki_light_line.html" title="Flexoki light line chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_light_bar.html" title="Flexoki light bar chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_light_area.html" title="Flexoki light area chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_light_scatter.html" title="Flexoki light scatter chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_light_histogram.html" title="Flexoki light histogram chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_light_box.html" title="Flexoki light box chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_light_pie.html" title="Flexoki light pie chart">
            </iframe>
            <iframe class="showcase" src="showcase/flexoki_light_heatmap.html" title="Flexoki light heatmap chart">
            </iframe>
        </section>
    </main>
</body>

</html>
