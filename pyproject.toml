[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flexoki-plotly"
version = "0.1.0"
description = "Flexoki light/dark color themes for Plotly"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["plotly>=5.0"]

[tool.setuptools]
py-modules = ["flexoki_plotly"]
